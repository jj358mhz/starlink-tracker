services:
  starlink-tracker:
    image: ghcr.io/jj358mhz/starlink-tracker:latest
    container_name: starlink-tracker
    restart: unless-stopped
    ports:
      - "8765:8000"
    volumes:
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - auth-net

networks:
  auth-net:
    external: true
